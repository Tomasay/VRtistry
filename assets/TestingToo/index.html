<!DOCTYPE html>
<html lang="en-us">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=0, maximum-scale=1, interactive-widget=overlays-content"/>
      <title>VRtistry</title>
       
       <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
       <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
       <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
       <link rel="manifest" href="favicon/site.webmanifest">

      <!--
        Start the two big downloads now, during HTML parse.

        Without these, nothing touches the build until style.css, wakeLock.js,
        gpu-recover.js, audio-gate.js, app.js and finally WebGL.loader.js have each been
        fetched and run in turn - six round trips before the 27 MB that actually matters
        even begins. The browser can open these connections immediately instead.

        `as="fetch" crossorigin` is what makes the preloaded response match the loader's
        own fetch() later; without crossorigin the file is downloaded a second time. If you
        change the compression format in Unity, change these too - a preload pointing at a
        file the loader never requests is a wasted download, and the console warns about it.
      -->
      <link rel="preload" href="Build/WebGL.wasm.br" as="fetch" crossorigin="anonymous">
      <link rel="preload" href="Build/WebGL.data.br" as="fetch" crossorigin="anonymous">
      <link rel="preload" href="Build/WebGL.loader.js" as="script">
      <!--
        WebGL.framework.js.br is deliberately NOT preloaded. Unity's loader requests it in a
        way that does not match a fetch preload, so adding one downloaded it twice - verified
        in DevTools. It is 0.1 MB and arrives while the other two are still streaming, so
        there is nothing to gain by fixing the match.
      -->

      <!--
        The webfont used to be pulled in by an @import at the top of style.css, which meant
        the browser had to download and parse style.css before it even learned the font
        existed. Requesting it here in parallel, and warming the two connections it needs,
        takes that chain out of first paint.
      -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700&display=swap">

      <link rel="stylesheet" href="Template/style.css" />


   </head>
   <body class="Dark">
      <!-- Unity Container -->
      <div id="main-container" class="fill-window">

         <div id="unity-container">
            <canvas id="unity-canvas"></canvas>
         </div>

         <!-- This is a simple progress bar -->
         <div id="loader" class="loader">
             
             <div class="logo-cont">
                  <img class="logo" src="Template/logo.gif"/>
               </div>
             
             <div class="progressbar">
                  <div id="fill" class="fill" style="width: 0%;"></div>
               </div>
            
         </div>
         
      </div>
       
       <!-- KEEP PAGE FOCUS -->
       <script src="NoSleep/wakeLock.js"></script>

       <!--
       <button onclick="fakeInputFocus()" id="fakeInputButton" style="position:absolute; top:100px; left:50%; transform: translate(-50%);" >TEST BUTTON</button>
       
       
       <input type="hidden" id="nameInput" placeholder="Enter Name" style="position: absolute; left: 50%; transform: translate(-50%, 0);">
       <input type="hidden" id="codeInput" placeholder="Enter Party Code" style="position: absolute; left: 50%; transform: translate(-50%, 0);">
       -->


      <!-- Reload once if Safari drops the WebGPU device, so a lost device is not a dead page -->
      <script src="Template/gpu-recover.js"></script>

      <!-- Keep Unity's autoplay retry loop quiet until the player has touched the page -->
      <script src="Template/audio-gate.js"></script>

      <script src="Template/app.js"> </script>
       
       <script>
           
           window.onload = function(){ try { setup(); } catch (e) { console.error('setup() failed:', e); } };
           let canvasInitialHeight, initialInnerHeight;
        
            function setup(){
                document.getElementById('unity-canvas').addEventListener('touchend', function(e){
                    e.stopPropagation();
                    e.preventDefault();

                    // Re-request wake lock on every canvas tap — guarantees it is called
                    // from a genuine user gesture, which iOS Safari requires in practice.
                    window.requestWakeLock();
                });

                canvasInitialHeight = document.getElementById("unity-canvas").height;
                initialInnerHeight = window.innerHeight;
            }
           
       </script>

   </body>
</html>
